# Settings (v1) vs SettingsV2 source field references
v1:
  - k: LookupUrl
    v: url or filepath listing base hosts
  - k: AuthHeader
    v: sent as the Authorization header
  - k: AppendPaths
    v: paths appended to every host
  - k: Labels
    v: static labels for each target
  - k: IgnoreList
    v: URLs to skip (exact match)
v2:
  - k: ServiceListUrl
    v: url or filepath listing service keys
  - k: ServiceDiscoverUrl
    v: per-service detail lookup, key appended
  - k: AuthHeader
    v: sent as the Authorization header
  - k: IgnoreList
    v: URLs to skip (exact or prefix match)
  - k: LowercaseLabels
    v: trim and lowercase every label
