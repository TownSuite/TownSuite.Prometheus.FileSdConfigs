# "How it works" step chips
- n: "1"
  color: "#00578E"
  title: Discover
  desc: Reads a service list, then each service's instances and endpoints — via SettingsV2.
- n: "2"
  color: "#6B95BE"
  title: Poll
  desc: Loops every DelayInSeconds, refreshing targets quietly in the background.
- n: "3"
  color: "#E48D1A"
  title: Write
  desc: Emits clean file_sd JSON for health checks, metrics and DNS probing.
- n: "4"
  color: "#2DA343"
  title: Scrape
  desc: Prometheus picks up the files via file_sd_configs — no restarts needed.
