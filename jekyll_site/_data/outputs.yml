# Output files emitted by the tool
- file: targets_v2.json
  color: "#2DA343"
  desc: Health-check endpoints per instance — feed this to the blackbox exporter.
- file: targets_prometheus_metrics.json
  color: "#E48D1A"
  desc: BaseUrl + PrometheusMetricsUrl for each discovered instance.
- file: targets_dns.json
  color: "#6B95BE"
  desc: Scheme and host only, grouped per service, labelled job=dns_prober.
- file: targets.json
  color: "#00578E"
  desc: Legacy v1 targets — every host crossed with AppendPaths, plus your static labels.
- file: targets_open_telemetry_metrics.json
  color: "#E03A3E"
  desc: OpenTelemetry endpoints. The writer exists but the poll loop does not invoke it yet.
